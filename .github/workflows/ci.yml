name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Skip lifecycle scripts; the browser for the browser tests is
      # installed in its own step below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Uses the CLI from the pinned playwright-core so the browser matches.
      - name: Install Chromium for browser tests
        run: npx playwright-core install --with-deps chromium --only-shell

      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("### Coverage (Node ${{ matrix.node-version }})\n");
              console.log("| Metric | Covered | Count |\n| --- | --- | --- |");
              ["statements", "branches", "functions", "lines"].forEach((k) => console.log(row(k)));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
