name: PR title

# Squash merges use the PR title as the commit message, and release-please
# reads those messages to pick the next version and write the changelog.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Start the PR title with a type, eg. 'feat: add --full-page' or 'fix(cli): handle empty dir'. feat makes a minor release, fix a patch release, and other types don't release."
            exit 1
          fi
