version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The weekly release reads these titles: runtime updates (fix(deps), eg.
    # playwright-core) ship as a patch release, while dev tooling updates
    # (chore(deps-dev)) don't release on their own.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Bundle low-risk dev tooling bumps into a single PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
